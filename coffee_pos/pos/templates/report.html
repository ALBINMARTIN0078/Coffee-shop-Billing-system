{% extends 'base.html' %}

{% block content %}

<div class="container">

<h2 class="mb-4">📊 Daily Sales Report</h2>

<div class="card shadow">

<div class="card-body">

<table class="table table-striped table-bordered">

<thead class="table-dark">

<tr>

<th>Order ID</th>
<th>Table</th>
<th>Payment</th>
<th>Total</th>
<th>Date</th>

</tr>

</thead>

<tbody>

{% for order in orders %}

<tr>

<td>{{order.id}}</td>

<td>{{order.table_number}}</td>

<td>{{order.payment_method}}</td>

<td>₹{{order.total}}</td>

<td>{{order.date}}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

<div class="mt-3">

<h4 class="text-success">

Total Sales: ₹{{total_sales}}

</h4>

</div>

</div>

{% endblock %}
